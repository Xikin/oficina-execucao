apiVersion: v1
kind: Secret
metadata:
  name: oficina-execucao-secret
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: "postgresql://execucao:<senha>@<endpoint-do-rds-da-execucao>:5432/execucao_db?schema=public"
  JWT_SECRET: "<o-mesmo-JWT_SECRET-do-OS-Service>"
  RABBITMQ_URL: "amqp://oficina:<senha>@rabbitmq.plataforma.svc.cluster.local:5672"
  NEW_RELIC_LICENSE_KEY: "<chave-de-ingestao-do-new-relic>"
